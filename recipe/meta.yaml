{% set name = "lotterycn" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/lotterycn-{{ version }}.tar.gz
  sha256: d14309a3b8668910aaeddbc6eaf84d84031120b2428d0b1a903cb3c416afe4a8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - tqdm >=4.64.1
    - numpy >=1.21.6
    - pandas >=1.4.0
    - requests >=2.28.1

test:
  imports:
    - lotterycn
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/uliontse/lotterycn
  summary: LotteryCN is a library which aims to bring enjoyable analysis of lottery in Python
  dev_url: https://github.com/UlionTse/lotterycn
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - UlionTse

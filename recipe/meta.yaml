{% set name = "lotterycn" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/lotterycn-{{ version }}.tar.gz
  sha256: f5785c6b94ce2e65e7d4d98d1f37cb71d3c5974f3cc4618b3d9d9d6257797e76

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=84.0.0
  run:
    - python >={{ python_min }}
    - rich >=15.0.0
    - pandas >=2.3.3
    - numpy >=1.26.4
    - requests >=2.34.2

test:
  imports:
    - lotterycn
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/uliontse/lotterycn
  summary: LotteryCN is a library which aims to bring enjoyable analysis of lottery in Python
  dev_url: https://github.com/UlionTse/lotterycn
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - UlionTse
